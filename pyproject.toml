[project]
name = "mlbmodel"
version = "0.1.0"
description = "MLB expected-runs model with +EV betting analysis."
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Project is consumed as importable backend packages, not via a console script.
packages = ["backend", "backend.data"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
