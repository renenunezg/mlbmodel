<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitch run value</title>
<style>
  :root { --bg: #fff; --fg: #111418; --muted: #667085; --line: #e4e7ec; --good: #0b7a4b; --bad: #b42318; --accent: #1d4ed8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1116; --fg: #e6e8eb; --muted: #98a2b3; --line: #262b33; --good: #4ade80; --bad: #f87171; --accent: #7aa2ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.note { color: var(--muted); margin: 0 0 12px; font-size: 13px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .controls label { display: grid; gap: 2px; font-size: 11px; color: var(--muted); }
  select, .tabs button { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .tabs { display: flex; align-self: end; }
  .tabs button { border-radius: 0; cursor: pointer; }
  .tabs button:first-child { border-radius: 6px 0 0 6px; }
  .tabs button:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
  .tabs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 4px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  th { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  th button { all: unset; cursor: pointer; }
  th[aria-sort] button { color: var(--accent); }
  col.rank { width: 30px; } col.num { width: 62px; } col.pitch { width: 120px; } col.wide { width: 96px; }
  td.rank, th.rank { text-align: left; color: var(--muted); }
  td.who, th.who { text-align: left; }
  td.who small { color: var(--muted); margin-left: 4px; }
  td.pitch, th.pitch { text-align: left; }
  .good { color: var(--good); } .bad { color: var(--bad); }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; color: var(--muted); font-size: 12px; }
  .foot button { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  .foot button:disabled { opacity: .4; cursor: default; }
  @media (max-width: 520px) {
    .wide { display: none; } col.wide { width: 0; } col.num { width: 60px; } col.pitch { width: 80px; }
    th { letter-spacing: 0; }
    td.who, td.pitch { white-space: normal; overflow-wrap: anywhere; }
    td.who small { display: block; margin-left: 0; font-size: 11px; }
  }
</style>
</head>
<body>
<main>
  <h1>Pitch run value</h1>
  <p class="note">Runs a pitcher added or saved, pitch by pitch, against the league average, with each pitch valued at its average over bases and outs. Negative is better for the pitcher.</p>
  <div class="controls">
    <div class="tabs" role="group" aria-label="View">
      <button type="button" data-view="pitchers" aria-pressed="true">Pitchers</button>
      <button type="button" data-view="types" aria-pressed="false">Pitch types</button>
    </div>
    <label>Season<select id="season"></select></label>
    <label>Minimum pitches<select id="min"></select></label>
  </div>
  <table>
    <colgroup id="cols"></colgroup>
    <thead><tr id="head"></tr></thead>
    <tbody id="body"></tbody>
  </table>
  <div class="foot">
    <button type="button" id="prev">Previous</button>
    <span id="count"></span>
    <button type="button" id="next">Next</button>
  </div>
</main>
<script>
const DATA = /*DATA*/null;
const PAGE = 25;
const PITCH = { FF: "Four-seam", SI: "Sinker", FC: "Cutter", SL: "Slider", ST: "Sweeper", SV: "Slurve", CU: "Curveball",
  KC: "Knuckle curve", CS: "Slow curve", CH: "Changeup", FS: "Splitter", FO: "Forkball", SC: "Screwball", KN: "Knuckleball",
  EP: "Eephus", FA: "Fastball" };
const MINIMUMS = { pitchers: [500, 1000, 2000], types: [200, 400, 800] };
const signed = (v, d) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d);
const tone = (v) => (v < 0 ? "good" : v > 0 ? "bad" : "");
const VIEWS = {
  pitchers: {
    rows: () => DATA.pitchers.map(([season, id, name, team, pitches, raw, context, runs]) =>
      ({ season, id, name, team, pitches, raw, context, runs, per100: 100 * runs / pitches })),
    columns: [
      { key: "pitches", label: "Pitches", cls: "num", text: (r) => r.pitches.toLocaleString("en-US") },
      { key: "raw", label: "Raw", cls: "wide", title: "Runs as they happened, before expected contact and the park, hitter and season adjustments", text: (r) => signed(r.raw, 1) },
      { key: "context", label: "In context", cls: "wide", title: "Adjusted runs with each pitch valued in the bases and outs it was thrown in", text: (r) => signed(r.context, 1) },
      { key: "runs", label: "Runs", cls: "num", tone: true, title: "Adjusted runs with each pitch valued at its average over bases and outs", text: (r) => signed(r.runs, 1) },
      { key: "per100", label: "Per 100", cls: "num", tone: true, text: (r) => signed(r.per100, 2) },
    ],
  },
  types: {
    rows: () => DATA.types.map(([season, id, name, team, type, pitches, runs, usage]) =>
      ({ season, id, name, team, type, pitches, runs, usage, per100: 100 * runs / pitches })),
    columns: [
      { key: "type", label: "Pitch", cls: "pitch", text: (r) => PITCH[r.type] || r.type },
      { key: "usage", label: "Usage", cls: "wide", text: (r) => Math.round(100 * r.usage) + "%" },
      { key: "pitches", label: "Pitches", cls: "wide", text: (r) => r.pitches.toLocaleString("en-US") },
      { key: "runs", label: "Runs", cls: "num", tone: true, text: (r) => signed(r.runs, 1) },
      { key: "per100", label: "Per 100", cls: "num", tone: true, text: (r) => signed(r.per100, 2) },
    ],
  },
};
// Pitch-type values at 400 pitches are mostly sampling noise, so that view opens on the largest minimum.
const DEFAULT_MIN = { pitchers: MINIMUMS.pitchers[1], types: MINIMUMS.types[2] };
const state = { view: "pitchers", season: DATA.seasons[DATA.seasons.length - 1], min: DEFAULT_MIN.pitchers, sort: "runs", asc: true, page: 0 };
const cache = {};
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, text) => { const n = Object.assign(document.createElement(tag), props); if (text != null) n.textContent = text; return n; };

function render() {
  const view = VIEWS[state.view];
  const all = cache[state.view] || (cache[state.view] = view.rows());
  const rows = all.filter((r) => r.season === state.season && r.pitches >= state.min)
    .sort((a, b) => { const x = a[state.sort], y = b[state.sort]; const d = typeof x === "string" ? x.localeCompare(y) : x - y; return state.asc ? d : -d; });
  const pages = Math.max(1, Math.ceil(rows.length / PAGE));
  state.page = Math.min(state.page, pages - 1);

  $("cols").replaceChildren(el("col", { className: "rank" }), el("col"), ...view.columns.map((c) => el("col", { className: c.cls })));
  const head = [el("th", { className: "rank" }, "#"), el("th", { className: "who" }, "Pitcher")];
  for (const c of view.columns) {
    const th = el("th", { className: c.cls === "wide" ? "wide" : c.cls === "pitch" ? "pitch" : "" });
    if (c.title) th.title = c.title;
    if (c.key === state.sort) th.setAttribute("aria-sort", state.asc ? "ascending" : "descending");
    const button = el("button", { type: "button" }, c.label + (c.key === state.sort ? (state.asc ? " ▲" : " ▼") : ""));
    button.onclick = () => { if (state.sort === c.key) state.asc = !state.asc; else { state.sort = c.key; state.asc = c.key === "runs" || c.key === "per100" || c.key === "type"; } state.page = 0; render(); };
    th.append(button);
    head.push(th);
  }
  $("head").replaceChildren(...head);

  const start = state.page * PAGE;
  $("body").replaceChildren(...rows.slice(start, start + PAGE).map((r, i) => {
    const tr = el("tr");
    const who = el("td", { className: "who", title: r.name + ", " + r.team }, r.name);
    who.append(el("small", {}, r.team));
    tr.append(el("td", { className: "rank" }, String(start + i + 1)), who);
    for (const c of view.columns) tr.append(el("td", { className: [c.cls === "wide" ? "wide" : c.cls === "pitch" ? "pitch" : "", c.tone ? tone(r[c.key]) : ""].join(" ").trim() }, c.text(r)));
    return tr;
  }));
  $("count").textContent = rows.length ? `${start + 1} to ${Math.min(start + PAGE, rows.length)} of ${rows.length}` : "No pitchers";
  $("prev").disabled = state.page === 0;
  $("next").disabled = state.page >= pages - 1;
}

function fillMinimums() {
  $("min").replaceChildren(...MINIMUMS[state.view].map((n) => el("option", { value: n }, n.toLocaleString("en-US"))));
  $("min").value = state.min;
}
$("season").replaceChildren(...DATA.seasons.slice().reverse().map((s) => el("option", { value: s }, String(s))));
$("season").onchange = (e) => { state.season = Number(e.target.value); state.page = 0; render(); };
$("min").onchange = (e) => { state.min = Number(e.target.value); state.page = 0; render(); };
$("prev").onclick = () => { state.page -= 1; render(); };
$("next").onclick = () => { state.page += 1; render(); };
for (const button of document.querySelectorAll(".tabs button")) {
  button.onclick = () => {
    state.view = button.dataset.view; state.min = DEFAULT_MIN[state.view]; state.sort = "runs"; state.asc = true; state.page = 0;
    document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-pressed", String(b === button)));
    fillMinimums(); render();
  };
}
fillMinimums();
render();
</script>
</body>
</html>
