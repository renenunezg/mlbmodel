name: Live Win Probability

on:
  # Supabase dispatches around unfinished games only when live publication is
  # stale or the worker is nearing expiry. One publisher runs at a time.
  repository_dispatch:
    types: [live-win-probability]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-win-probability
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        # Production runs the release branch, never main (AGENTS.md, Safety and load-bearing behavior).
        with:
          ref: release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install live publisher dependencies
        run: pip install -c constraints.txt numpy pandas requests SQLAlchemy psycopg2-binary python-dotenv
      - name: Restore Odds API state
        # The closing-line budget (quota headers and the day's request count) lives in this file; the
        # morning pull and the nightly refresh save it under the same prefix.
        uses: actions/cache/restore@v4
        with:
          path: cache/odds_api_state.json
          key: odds-api-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            odds-api-state-${{ runner.os }}-
      - name: Download validated probability artifact
        run: |
          mkdir -p models
          curl --fail --location --retry 3 --output models/live_win_expectancy.json \
            https://github.com/renenunezg/mlbmodel/releases/download/live-win-expectancy-2026-09-30/live_win_expectancy.json
          echo 'ceda00504006d66e455d5335529787461a41f13cac72303df2d57c202fbdfc1a  models/live_win_expectancy.json' | sha256sum --check
      - name: Publish live snapshots
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Closing lines: one Odds API request per first-pitch cluster inside this budget, ESPN otherwise.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_CLOSING_RESERVE: ${{ vars.ODDS_API_CLOSING_RESERVE || '60' }}
          ODDS_API_CLOSING_DAILY_CALLS: ${{ vars.ODDS_API_CLOSING_DAILY_CALLS || '2' }}
        # Hand off before the six-hour runner limit; the queued replacement
        # starts after this worker exits. Idle slates exit early.
        run: python -m v2.live.publish --artifact models/live_win_expectancy.json --watch --duration 20700 --publish
      - name: Persist Odds API state
        if: ${{ always() && hashFiles('cache/odds_api_state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: cache/odds_api_state.json
          key: odds-api-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
