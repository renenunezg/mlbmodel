name: Train v2 Models

on:
  # No schedule over the winter: with no new games the daily fit is identical, and the
  # Daily Pipeline that follows it scores an empty slate. Restore the daily cron for spring
  # training (offset from the hour, e.g. "7 11 * * *", since :00 is the most congested slot).
  # Player grades and prospects run on their own schedule in players.yml.
  workflow_dispatch:

concurrency:
  group: train-v2
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        # Production runs the release branch, never main: promote a validated commit with
        # `git push origin main:release` (see AGENTS.md, Safety and load-bearing behavior).
        with:
          ref: release

      - name: Restore Statcast cache
        uses: actions/cache@v4
        with:
          path: cache
          key: statcast-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            statcast-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -c constraints.txt -r requirements.txt -r v2/requirements.txt && pip install --no-deps -e .

      - name: Refresh Statcast caches through the current season
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: "."
        run: python -m v2.data.build_cache --years $(seq 2024 "$(date -u +%Y)")

      - name: Train v2 models
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: "."
        run: python -m v2.pipeline.train --mode full --archive

      - name: Build compatible simulator tables
        run: python -m v2.simulator.build_advancement_table --years 2024 2025

      - name: Verify production artifacts
        run: python -m v2.pipeline.verify_artifacts

      - name: Write posterior summaries to Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: "."
        run: python -m v2.pipeline.write_posterior_summaries

      - name: Save validated simulator bundle
        uses: actions/cache/save@v4
        with:
          path: |
            v2/bayesian/posteriors/*.nc
            v2/bayesian/posteriors/diagnostics.json
            v2/simulator/tables/*.parquet
          key: sim-v3-bundle-${{ runner.os }}-${{ github.run_id }}
