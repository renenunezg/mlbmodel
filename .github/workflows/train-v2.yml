name: Train v2 Models

on:
  schedule:
    # Offset 7 min from the hour: GitHub Actions explicitly suggests avoiding
    # exact-hour cron times since :00 is the most congested slot.
    - cron: "7 11 * * *"
  workflow_dispatch:

concurrency:
  group: train-v2
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        # Scoring and training use the same validated simulator release.
        with:
          ref: 5eb0ca7ebae6f450b6741c50402e2de83e7e37f0

      - name: Restore Statcast cache
        uses: actions/cache@v4
        with:
          path: cache
          key: statcast-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            statcast-${{ runner.os }}-

      # FSL and spring pitches keep their own cache so the workflows that share the Statcast cache cannot race it away.
      - name: Restore prospect-level Statcast caches
        uses: actions/cache@v4
        with:
          path: |
            cache/statcast_fsl_*.parquet
            cache/statcast_spring_*.parquet
          key: statcast-prospect-levels-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            statcast-prospect-levels-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -c constraints.txt -r requirements.txt -r v2/requirements.txt && pip install --no-deps -e .

      - name: Refresh Statcast caches through the current season
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: "."
        run: python -m v2.data.build_cache --years $(seq 2024 "$(date -u +%Y)")

      - name: Refresh Triple-A Statcast caches (time-boxed, resumes across runs)
        continue-on-error: true
        env:
          PYTHONPATH: "."
        run: timeout --preserve-status 15m python -m v2.data.build_aaa_cache --years $(seq 2022 "$(date -u +%Y)")

      - name: Top up the Florida State League Statcast cache (backfill runs in fill-fsl-cache.yml)
        continue-on-error: true
        env:
          PYTHONPATH: "."
        run: timeout --preserve-status 5m python -m v2.data.build_aaa_cache --level fsl --years $(seq $(( $(date -u +%Y) - 2 )) "$(date -u +%Y)")

      - name: Top up the spring training Statcast cache (backfill runs in fill-fsl-cache.yml)
        continue-on-error: true
        env:
          PYTHONPATH: "."
        run: timeout --preserve-status 3m python -m v2.data.build_aaa_cache --level spring --years "$(date -u +%Y)"

      - name: Refresh player contracts (Mondays)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: "."
        run: if [ "$(date -u +%u)" = "1" ]; then python -m v2.players.contracts --season "$(date -u +%Y)"; fi

      - name: Score player values
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: "."
        run: python -m v2.players.score --as-of "$(date -u +%F)"

      - name: Refresh prospect feeds for the scoring window (time-boxed, resumes across runs)
        continue-on-error: true
        env:
          PYTHONPATH: "."
        run: timeout --preserve-status 16m python -m v2.prospects.feeds --years $(seq $(( $(date -u +%Y) - 2 )) "$(date -u +%Y)") --minutes 15

      - name: Score prospects (Mondays; the publish is skipped when the board is unchanged)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: "."
        run: if [ "$(date -u +%u)" = "1" ]; then timeout --preserve-status 10m python -m v2.prospects.score --as-of "$(date -u +%F)"; fi

      - name: Train v2 models
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: "."
        run: python -m v2.pipeline.train --mode full --archive

      - name: Build compatible simulator tables
        run: python -m v2.simulator.build_advancement_table --years 2024 2025

      - name: Verify production artifacts
        run: python -m v2.pipeline.verify_artifacts

      - name: Write posterior summaries to Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: "."
        run: python -m v2.pipeline.write_posterior_summaries

      - name: Save validated simulator bundle
        uses: actions/cache/save@v4
        with:
          path: |
            v2/bayesian/posteriors/*.nc
            v2/bayesian/posteriors/diagnostics.json
            v2/simulator/tables/*.parquet
          key: sim-v3-bundle-${{ runner.os }}-${{ github.run_id }}
