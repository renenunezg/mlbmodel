name: Export validated simulator bundle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: |
            v2/bayesian/posteriors/*.nc
            v2/bayesian/posteriors/diagnostics.json
            v2/simulator/tables/*.parquet
          key: sim-v3-bundle-${{ runner.os }}-${{ github.run_id }}
          restore-keys: sim-v3-bundle-${{ runner.os }}-
          fail-on-cache-miss: true
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-bundle-for-isolated-analysis
          path: |
            v2/bayesian/posteriors/*.nc
            v2/bayesian/posteriors/diagnostics.json
            v2/simulator/tables/*.parquet
          if-no-files-found: error
          retention-days: 1
